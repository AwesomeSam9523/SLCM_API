version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: postgres
    ports:
      - "5480:5432"

  api:
    build: .
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - .env
